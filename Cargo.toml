[workspace]
members = ["crates/forwiroh", "crates/forwiroh-cli"]
resolver = "3"

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT"
rust-version = "1.91"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"

# Smallest distribution, at the cost of terminating the process on any panic
# (including a panic in a Tokio task). Normal releases retain task isolation.
[profile.min-size]
inherits = "release"
panic = "abort"
