[package]
name = "forwiroh"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
anyhow.workspace = true
blake3 = "1"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
iroh = { version = "=1.5.0", default-features = false, features = ["tls-ring"] }
tokio-util = { version = "0.7", features = ["rt"] }
base64 = "0.23"
getrandom = "0.4"
subtle = "2"
fs2 = "0.4"
ipnet = { version = "2", features = ["serde"] }
fast-socks5 = "1"
bytes = "1"
futures-util = "0.3"
qrcode = { version = "0.14", default-features = false }
netstack-smoltcp = "=0.2.5"
etherparse = "0.21"
socket2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "linux")'.dependencies]
tun = { version = "0.8", features = ["async"] }

# Iroh's netdev 0.46 still uses iOS declarations removed in libc 0.2.190.
[target.'cfg(target_os = "ios")'.dependencies]
libc = "=0.2.189"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"
ndk-context = "0.1"
rustls-platform-verifier = "0.7.1"
