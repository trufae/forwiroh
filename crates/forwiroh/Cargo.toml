[package]
name = "forwiroh"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
tokio-util = { version = "0.7", features = ["rt"] }
base64 = "0.22"
getrandom = "0.4"
subtle = "2"
fs2 = "0.4"
ipnet = { version = "2", features = ["serde"] }
fast-socks5 = "1"
bytes = "1"
futures-util = "0.3"
qrcode = { version = "0.14", default-features = false }
netstack-smoltcp = "=0.2.4"
etherparse = "0.16"
socket2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
tun = { version = "0.8", features = ["async"] }

# Iroh 1.3/netwatch 0.19/netdev 0.46 still use Darwin declarations removed
# in libc 0.2.190. Keep this pin until their Apple mobile bindings are updated.
[target.'cfg(target_os = "ios")'.dependencies]
libc = "=0.2.188"

[dev-dependencies]
tempfile = "3"
smoltcp = { version = "0.12", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"
ndk-context = "0.1"
rustls-platform-verifier = "0.7.1"
