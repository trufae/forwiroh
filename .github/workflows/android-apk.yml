name: Android debug APK

on:
  push:
    branches: [main, 'feat/**']
    paths: ['apps/android/**', 'crates/forwiroh/**', 'Cargo.*', '.github/workflows/android-apk.yml']
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-apk
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108' 'cmake;3.22.1'
      - name: Build installable debug APK with both ABIs
        working-directory: apps/android
        run: ./gradlew --no-daemon assembleDebug lintDebug -PsplitApks
      - name: Verify and package APK
        run: |
          mkdir -p dist/android
          for abi in arm64-v8a x86_64 universal; do
            name="forwiroh-android-$abi-debug.apk"
            if [ "$abi" = universal ]; then name=forwiroh-android-debug.apk; fi
            cp "apps/android/app/build/outputs/apk/debug/app-$abi-debug.apk" "dist/android/$name"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "dist/android/$name"
          done
          cd dist/android
          sha256sum ./*.apk > ANDROID-SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Forwiroh-Android
          path: dist/android/*
          if-no-files-found: error
