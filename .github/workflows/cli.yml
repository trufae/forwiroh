name: CLI binaries

on:
  push:
    branches: [main, 'feat/**']
    paths: ['crates/**', 'Cargo.*', 'install.*', 'scripts/*cli*', 'scripts/test-install*', '.github/workflows/cli.yml']
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - os: ubuntu-24.04
            target: aarch64-linux-android
          - os: ubuntu-24.04
            target: x86_64-linux-android
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      # netdev catches a missing JNI context in standalone Android processes.
      # It needs unwinding; panic=abort would terminate the CLI during startup.
      FORWIROH_CLI_PROFILE: ${{ contains(matrix.target, 'android') && 'release' || 'min-size' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}
      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: android-actions/setup-android@v3
        if: contains(matrix.target, 'android')
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Configure native compilers
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: |
          key=$(printf '%s' "$RUST_TARGET" | tr '[:lower:]-' '[:upper:]_')
          if [[ "$RUST_TARGET" == *musl ]]; then
            echo "CARGO_TARGET_${key}_LINKER=musl-gcc" >> "$GITHUB_ENV"
            echo "CC_${RUST_TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
          elif [[ "$RUST_TARGET" == *android ]]; then
            sdkmanager 'ndk;28.0.13004108'
            bin="$ANDROID_HOME/ndk/28.0.13004108/toolchains/llvm/prebuilt/linux-x86_64/bin"
            echo "CARGO_TARGET_${key}_LINKER=$bin/${RUST_TARGET}28-clang" >> "$GITHUB_ENV"
            echo "CC_${RUST_TARGET//-/_}=$bin/${RUST_TARGET}28-clang" >> "$GITHUB_ENV"
            echo "AR_${RUST_TARGET//-/_}=$bin/llvm-ar" >> "$GITHUB_ENV"
          elif [[ "$RUST_TARGET" == *windows* ]]; then
            # A downloaded CLI must run without installing the VC++ runtime.
            echo "CARGO_TARGET_${key}_RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"
          fi
      - name: Build size-optimized CLI
        run: cargo build --locked --profile "$FORWIROH_CLI_PROFILE" -p forwiroh-cli --target '${{ matrix.target }}'
      - name: Test native CLI and persistence
        if: ${{ !contains(matrix.target, 'android') }}
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: |
          extension=
          if [[ "$RUST_TARGET" == *windows* ]]; then extension=.exe; fi
          python3 scripts/cli-portable-smoke.py "target/$RUST_TARGET/$FORWIROH_CLI_PROFILE/forwiroh$extension"
          cargo test --locked -p forwiroh --test foundation --target "$RUST_TARGET"
      - name: Full Unix CLI integration
        if: runner.os != 'Windows' && !contains(matrix.target, 'android')
        run: python3 scripts/cli-smoke.py 'target/${{ matrix.target }}/${{ env.FORWIROH_CLI_PROFILE }}/forwiroh'
      - name: Enable Android emulator acceleration
        if: matrix.target == 'x86_64-linux-android'
        run: sudo chmod 666 /dev/kvm
      - name: Test standalone Android CLI
        if: matrix.target == 'x86_64-linux-android'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: sh scripts/cli-android-smoke.sh target/x86_64-linux-android/${{ env.FORWIROH_CLI_PROFILE }}/forwiroh
      - name: Package CLI
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: |
          extension=
          if [[ "$RUST_TARGET" == *windows* ]]; then extension=.exe; fi
          python3 scripts/package-cli.py --target "$RUST_TARGET" --binary "target/$RUST_TARGET/$FORWIROH_CLI_PROFILE/forwiroh$extension"
      - name: Test PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-install.ps1 -Archive 'dist/cli/forwiroh-${{ matrix.target }}.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: dist/cli/*
          if-no-files-found: error
  assemble:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          merge-multiple: true
          path: dist/cli
      - run: python3 scripts/package-cli.py --assemble
      - run: cd dist/cli && sha256sum --check CLI-SHA256SUMS
      - run: python3 scripts/test-install.py
      - uses: actions/upload-artifact@v4
        with:
          name: Forwiroh-CLI
          path: dist/cli/*
          if-no-files-found: error
