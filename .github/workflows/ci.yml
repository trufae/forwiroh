name: Build and test
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked
      - run: python3 scripts/cli-smoke.py
      - name: Public relay without direct UDP
        if: runner.os == 'Linux'
        run: cargo test -p forwiroh --test relay --locked -- --ignored
      - name: Real Linux TUN forwarding
        if: runner.os == 'Linux'
        run: sudo python3 scripts/vpn-kernel.py
  # App/UI jobs are retained for future use but disabled.
  ios:
    if: ${{ false }}
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios
          cache-on-failure: true
      - name: Verify app and extension project wiring
        run: python3 scripts/check-xcode.py
      - name: Build native app and extension for device (unsigned)
        run: >-
          xcodebuild -project apps/ios/Forwiroh.xcodeproj -scheme Forwiroh
          -configuration Release -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath DerivedData/device ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build
      - name: Build native app and extension for simulator
        run: >-
          xcodebuild -project apps/ios/Forwiroh.xcodeproj -scheme Forwiroh
          -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath DerivedData/simulator ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: Forwiroh-unsigned-device-and-simulator
          path: DerivedData/*/Build/Products/Release-*/*.app
  android:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
          cache-on-failure: true
      - name: Install Android native toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108' 'cmake;3.22.1'
      - name: Build both ABIs and lint
        working-directory: apps/android
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest lintDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android JNI, transport and activity tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: apps/android
          script: ./gradlew --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Forwiroh-android-debug
          path: |
            apps/android/app/build/outputs/apk/debug/*.apk
            apps/android/app/build/reports/
  desktop:
    if: ${{ false }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ runner.os }}
      - name: SwiftUI macOS app
        if: runner.os == 'macOS'
        run: ./apps/macos/build.sh
      - name: GTK development dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libjson-glib-dev valac meson ninja-build xvfb xauth dbus-x11
      - name: GTK4/Vala app and bridge test
        if: runner.os == 'Linux'
        run: ./apps/gtk/build.sh && meson test -C apps/gtk/build --print-errorlogs
      - name: GTK native UI smoke
        if: runner.os == 'Linux'
        run: >-
          FORWIROH_STATE=$RUNNER_TEMP/forwiroh-ui-test FORWIROH_UI_SMOKE=1
          G_DEBUG=fatal-criticals xvfb-run -a dbus-run-session -- apps/gtk/build/forwiroh-gtk
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: Forwiroh-macOS
          path: apps/macos/build/Forwiroh.app
