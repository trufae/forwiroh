version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: gradle
    directory: /apps/android
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: nix
    directory: /nix
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /scripts
    schedule:
      interval: weekly
