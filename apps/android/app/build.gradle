plugins { id 'com.android.application' }

def splitApks = project.hasProperty('splitApks')

android {
    namespace 'org.forwiroh'
    compileSdk 35
    ndkVersion '28.0.13004108'
    defaultConfig {
        applicationId 'org.forwiroh'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.1.2'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        if (!splitApks) { ndk { abiFilters 'arm64-v8a', 'x86_64' } }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static' } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    if (splitApks) {
        splits {
            abi {
                enable true
                reset()
                include 'arm64-v8a', 'x86_64'
                universalApk true
            }
        }
    }
}

// Keep the JVM verifier component synchronized with Cargo's locked version.
def lock = file('../../../Cargo.lock').text
def verifier = (lock =~ /(?s)name = "rustls-platform-verifier-android"\s+version = "([^"]+)"/)
if (!verifier.find()) throw new GradleException('Missing Android rustls verifier in Cargo.lock')
def verifierVersion = verifier.group(1)

dependencies {
    implementation "org.rustls:rustls-platform-verifier:${verifierVersion}"
    // The verifier AAR has Kotlin bytecode but its POM omits the runtime.
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.1.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
